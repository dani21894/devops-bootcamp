<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muhamad Fitri — DevOps Bootcamp 2026</title>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f0f2f5;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 48px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      opacity: 0;
      animation: fade-in 1s ease forwards;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18);
    }

    .badge {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 999px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      animation: pulse 2.5s ease-in-out infinite;
    }

    .name {
      margin: 16px 0 4px;
      font-size: 28px;
      color: #1a1a2e;
    }

    .role {
      margin: 0;
      color: #6b7280;
      font-size: 16px;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(106, 17, 203, 0.35); }
      50%      { transform: scale(1.06); box-shadow: 0 0 0 8px rgba(106, 17, 203, 0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">DevOps Bootcamp 2026 — Cohort 1</span>
    <h1 class="name">Muhamad Fitri</h1>
    <p class="role">Student</p>
  </div>
</body>
</html>
